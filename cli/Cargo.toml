[package]
name = "sentinel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
sentinel-core.workspace = true
sentinel-browser.workspace = true
sentinel-ai.workspace = true
sentinel-store.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Drives the async browser/ai adapters. rt-multi-thread so the chromiumoxide handler
# task runs concurrently with the pipeline; macros for `#[tokio::main]`.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
